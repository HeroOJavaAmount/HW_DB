spring:
  datasource:
    url: jdbc:h2:mem:transferdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

app:
  logging:
    file-path: logs/transfer.log
  verification:
    code-length: 4
    default-code: "0000"
  limits:
    max-transfer-amount: 100000000
    min-transfer-amount: 100